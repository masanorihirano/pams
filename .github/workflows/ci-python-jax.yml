# Tests of JaxAgentParallelRunner, which need JAX and Flax (optional dependencies of pams)

name: CI-jax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 22 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# uv uses the Python from actions/setup-python (setup-uv sets UV_PYTHON to the
# same version) and never downloads one. Only `uv sync` and `uv pip install`
# install packages; `uv run` uses that environment as it is.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_NO_SYNC: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv sync
          # the CPU builds of JAX and Flax, which are not dependencies of pams, into the .venv
          # made by uv sync. Recent JAX needs numpy>=2, so uv pip replaces the numpy 1.x
          # installed by uv sync, although pams declares numpy<2 on this Python version: uv pip
          # install does not report it (`uv pip check` would), and pams also runs with numpy 2,
          # which it uses on Python 3.13+. UV_NO_SYNC keeps `uv run` from syncing the
          # environment again, which would put numpy 1.x back.
          uv pip install "jax[cpu]" flax
          # the tests are skipped instead of failing if JAX or Flax cannot be imported
          uv run python -c "import flax, jax; print(jax.__version__, flax.__version__)"
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run pytest --cov=./ --cov-report=xml tests/pams/runners/test_jax_parallel.py tests/pams/runners/test_jax_parallel_import.py
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required for uploads from non-fork branches since v4
          files: ./coverage.xml
          flags: jax
          verbose: true
