# Tests of JaxAgentParallelRunner, which need JAX and Flax (optional dependencies of pams)

name: CI-jax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 22 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          poetry install
          # the CPU builds of JAX and Flax, which are not dependencies of pams. Recent JAX needs
          # numpy>=2, so pip replaces the numpy 1.x installed by poetry and reports that pams
          # declares numpy<2 on this Python version, but it still installs them (pams also runs
          # with numpy 2, which it uses on Python 3.13).
          poetry run pip install "jax[cpu]" flax
          # the tests are skipped instead of failing if JAX or Flax cannot be imported
          poetry run python -c "import flax, jax; print(jax.__version__, flax.__version__)"
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: |
          poetry run pytest --cov=./ --cov-report=xml tests/pams/runners/test_jax_parallel.py tests/pams/runners/test_jax_parallel_import.py
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required for uploads from non-fork branches since v4
          files: ./coverage.xml
          flags: jax
          verbose: true
