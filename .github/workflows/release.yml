name: Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed

# Every job checks out github.event.pull_request.merge_commit_sha, i.e. the
# commit that the release pull request produced on main and that is tagged.
# Only the jobs that push to the repository get write access.
permissions:
  contents: read

jobs:
  tagging:
    runs-on: ubuntu-latest
    # Only a release branch of this repository (not of a fork) triggers a release.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}
    steps:
      - name: Get the version
        id: get_version
        run: |
          echo "TAG=${SOURCE_VERSION#release/}" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_VERSION: ${{ github.event.pull_request.head.ref }}
      - name: Echo tag
        run: echo "$TAG"
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check that the version was bumped
        run: |
          pyproject_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          module_version=$(python3 -c 'import runpy; print(runpy.run_path("pams/version.py")["__version__"])')
          echo "pyproject.toml: ${pyproject_version}, pams/version.py: ${module_version}, tag: ${TAG}"
          if [ "$pyproject_version" != "$TAG" ] || [ "$module_version" != "$TAG" ]; then
            echo "::error::The version in pyproject.toml / pams/version.py does not match ${TAG}. Merge the version bump pull request into the release branch first."
            exit 1
          fi
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}
      - name: Tag the merge commit
        run: |
          git config user.email "masa.hirano.1996@gmail.com"
          git config user.name "Masanori HIRANO"
          git tag -a "$TAG" -m " "
          git push origin "refs/tags/${TAG}"
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}

  test:
    # The type of runner that the job will run on
    name: final test
    runs-on: ${{ matrix.platform }}
    needs: tagging
    strategy:
      max-parallel: 5
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - platform: windows-latest
            python-version: 3.13

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          poetry install
      - name: Test
        run: |
          poetry run black --check --diff --quiet .
          poetry run isort --check --quiet .
          poetry run pflake8 .
          poetry run mypy .
          poetry run pytest tests/

  releasetest:
    # The type of runner that the job will run on
    name: release test
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Building and publishing do not need the project's (dev) dependencies,
      # so `poetry install` is not run here.
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: test release
        run: |
          poetry config repositories.testpypi https://test.pypi.org/legacy/
          poetry publish --build -r testpypi
        env:
          POETRY_PYPI_TOKEN_TESTPYPI: ${{ secrets.TEST_PYPI_TOKEN }}

  releasetestcheck:
    name: release test check
    needs: [tagging, releasetest]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Poll TestPyPI (at most 30 x 20 s) instead of sleeping for a fixed time.
      # --no-index makes sure that the file comes from TestPyPI, not from PyPI.
      - name: Download test package from TestPyPI
        run: |
          for attempt in $(seq 1 30); do
            if python -m pip download --no-deps --no-index --no-cache-dir \
                --find-links https://test.pypi.org/simple/pams/ \
                --dest "${RUNNER_TEMP}/testpypi" "pams==${TAG}"; then
              exit 0
            fi
            echo "pams==${TAG} is not available on TestPyPI yet (attempt ${attempt}/30)"
            sleep 20
          done
          echo "::error::pams==${TAG} did not become available on TestPyPI"
          exit 1
        env:
          TAG: ${{ needs.tagging.outputs.tag }}
      - name: Install test package
        run: |
          python -m pip install "${RUNNER_TEMP}"/testpypi/pams-*
          python -m pip install pytest
          rm -r pams
          rm pyproject.toml
      - name: Test
        run: |
          pytest tests/

  release:
    name: release
    needs: [releasetestcheck, tagging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # The credentials are kept for deleting the release branch at the end.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: release
        run: |
          poetry publish --build
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
      - name: Generate checksum
        run: |
          cd dist
          sha256sum -- * > "pams-${TAG}-checksums.txt"
          cat "pams-${TAG}-checksums.txt"
        env:
          TAG: ${{ needs.tagging.outputs.tag }}
      - name: Create release
        run: |
          {
            printf '%s\n\n' "$PR_BODY"
            echo "This release is automatically generated."
            echo "Please see the pull request."
            echo "[${PR_URL}](${PR_URL})"
          } > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagging.outputs.tag }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: remove branch
        run: |
          git push --delete origin "refs/heads/${HEAD_REF}"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
