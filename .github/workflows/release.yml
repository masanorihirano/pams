name: Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed

# Every job checks out github.event.pull_request.merge_commit_sha, i.e. the
# commit that the release pull request produced on main and that is tagged.
# Only the jobs that push to the repository get write access.
permissions:
  contents: read

# uv uses the Python from actions/setup-python (setup-uv sets UV_PYTHON to the
# same version) and never downloads one. Only `uv sync` resolves and installs;
# `uv run` uses that environment as it is.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_NO_SYNC: "1"

jobs:
  tagging:
    runs-on: ubuntu-latest
    # Only a release branch of this repository (not of a fork) triggers a release.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}
    steps:
      - name: Get the version
        id: get_version
        run: |
          echo "TAG=${SOURCE_VERSION#release/}" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_VERSION: ${{ github.event.pull_request.head.ref }}
      - name: Echo tag
        run: echo "$TAG"
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check that the version was bumped
        run: |
          pyproject_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module_version=$(python3 -c 'import runpy; print(runpy.run_path("pams/version.py")["__version__"])')
          echo "pyproject.toml: ${pyproject_version}, pams/version.py: ${module_version}, tag: ${TAG}"
          if [ "$pyproject_version" != "$TAG" ] || [ "$module_version" != "$TAG" ]; then
            echo "::error::The version in pyproject.toml / pams/version.py does not match ${TAG}. Merge the version bump pull request into the release branch first."
            exit 1
          fi
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}
      - name: Tag the merge commit
        run: |
          # "Re-run all jobs" finds the tag that the first run pushed. Accept it
          # if it points to this commit; refuse a tag on any other commit.
          # An annotated tag has a peeled "^{}" entry holding its commit; a
          # lightweight tag has only the direct entry, which is the commit.
          tag_refs=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          tagged_commit=$(printf '%s\n' "$tag_refs" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1 }')
          if [ -z "$tagged_commit" ]; then
            tagged_commit=$(printf '%s\n' "$tag_refs" | awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }')
          fi
          if [ -n "$tagged_commit" ]; then
            if [ "$tagged_commit" = "$(git rev-parse HEAD)" ]; then
              echo "Tag ${TAG} already points to this commit; not creating it again."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on another commit (${tagged_commit})."
            exit 1
          fi
          git config user.email "masa.hirano.1996@gmail.com"
          git config user.name "Masanori HIRANO"
          git tag -a "$TAG" -m " "
          git push origin "refs/tags/${TAG}"
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}

  test:
    # The type of runner that the job will run on
    name: final test
    runs-on: ${{ matrix.platform }}
    needs: tagging
    strategy:
      max-parallel: 5
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install dependencies
        run: |
          uv sync
      - name: Test
        run: |
          uv run black --check --diff --quiet .
          uv run isort --check --quiet .
          uv run pflake8 .
          uv run mypy .
          uv run pytest tests/

  releasetest:
    # The type of runner that the job will run on
    name: release test
    needs: test
    runs-on: ubuntu-latest
    outputs:
      uv-version: ${{ steps.setup-uv.outputs.uv-version }}
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Building and publishing do not need the project's (dev) dependencies,
      # so `uv sync` is not run here.
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Build
        run: |
          uv build
      - name: test release
        run: |
          uv publish --publish-url https://test.pypi.org/legacy/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}

  releasetestcheck:
    name: release test check
    needs: [tagging, releasetest]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Poll TestPyPI (at most 30 x 20 s) instead of sleeping for a fixed time.
      # --no-index makes sure that the file comes from TestPyPI, not from PyPI.
      - name: Download test package from TestPyPI
        run: |
          for attempt in $(seq 1 30); do
            if python -m pip download --no-deps --no-index --no-cache-dir \
                --find-links https://test.pypi.org/simple/pams/ \
                --dest "${RUNNER_TEMP}/testpypi" "pams==${TAG}"; then
              exit 0
            fi
            echo "pams==${TAG} is not available on TestPyPI yet (attempt ${attempt}/30)"
            sleep 20
          done
          echo "::error::pams==${TAG} did not become available on TestPyPI"
          exit 1
        env:
          TAG: ${{ needs.tagging.outputs.tag }}
      - name: Install test package
        run: |
          python -m pip install "${RUNNER_TEMP}"/testpypi/pams-*
          python -m pip install pytest
          rm -r pams
          rm pyproject.toml
      - name: Test
        run: |
          pytest tests/

  release:
    name: release
    needs: [releasetest, releasetestcheck, tagging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # No git credentials are left on disk: only the two gh steps below get
      # the write token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The files are built again here. With the same uv as in releasetest,
      # they are byte-identical to the ones tested on TestPyPI.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ needs.releasetest.outputs.uv-version }}
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Build
        run: |
          uv build
      - name: release
        run: |
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - name: Generate checksum
        run: |
          cd dist
          sha256sum -- * > "pams-${TAG}-checksums.txt"
          cat "pams-${TAG}-checksums.txt"
        env:
          TAG: ${{ needs.tagging.outputs.tag }}
      - name: Create release
        run: |
          {
            printf '%s\n\n' "$PR_BODY"
            echo "This release is automatically generated."
            echo "Please see the pull request."
            echo "[${PR_URL}](${PR_URL})"
          } > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$TAG" dist/* --verify-tag --target "$MERGE_SHA" \
            --title "$TAG" --notes-file "${RUNNER_TEMP}/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagging.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: remove branch
        run: |
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${HEAD_REF}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
