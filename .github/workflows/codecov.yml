# This is a basic workflow to help you get started with Actions

name: codecov CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main, dev, release/*]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# uv uses the Python from actions/setup-python (setup-uv sets UV_PYTHON to the
# same version) and never downloads one. Only `uv sync` resolves and installs;
# `uv run` uses that environment as it is.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_NO_SYNC: "1"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install dependencies
        run: |
          uv sync
      - name: make cov report
        run: |
          uv run pytest --cov=./ --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required for uploads from non-fork branches since v4
          files: ./coverage.xml
          flags: pytest
          verbose: true
