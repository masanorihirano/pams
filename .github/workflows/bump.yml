name: Version Bump

# `create` fires for every new branch or tag and does not support branch
# filters, so the job itself is restricted to release/* branches.
on:
  create:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  makepr:
    name: make pr
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        run: pip install poetry
      - name: Bump version
        id: bump
        run: |
          version="${BRANCH#release/}"
          title=$(poetry version "$version")
          # `poetry version` also accepts bump rules such as "patch"; make sure
          # that the branch name is the (normalized) version itself.
          if [ "$(poetry version --short)" != "$version" ]; then
            echo "::error::${BRANCH} is not of the form release/X.Y.Z"
            exit 1
          fi
          echo "PR_TITLE=${title}" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.ref_name }}
      - name: Bump version 2
        run: |
          echo "__version__ = \"${BRANCH#release/}\"" > pams/version.py
        env:
          BRANCH: ${{ github.ref_name }}
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          author: GitHub Actions <action@github.com>
          commit-message: ${{ steps.bump.outputs.PR_TITLE }}
          delete-branch: true
          branch-suffix: short-commit-hash
          title: ${{ steps.bump.outputs.PR_TITLE }}
