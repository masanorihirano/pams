# Tests of TensorFlowAgentParallelRunner, which need TensorFlow.
# TensorFlow is an optional dependency, so the main CI does not install it and skips these tests.

name: CI-tensorflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          poetry install
          # the CPU-only build of TensorFlow, installed into the environment of poetry;
          # numpy is kept at 1.x, which pams requires on Python < 3.13
          poetry run pip install tensorflow-cpu "numpy<2"
          poetry run pip check
          # fail here instead of skipping the tests if TensorFlow cannot be imported
          poetry run python -c "import tensorflow as tf; print(tf.__version__)"
      - name: Test
        run: |
          poetry run pytest tests/pams/runners/test_tensorflow_parallel.py
