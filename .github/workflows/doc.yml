name: doc

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every Python even if one fails. deploy needs all of them to pass.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The site on gh-pages is built with this Python.
        include:
          - python-version: "3.11"
            deploy: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          poetry install
      - run: poetry run make doc
      - name: Upload the HTML
        if: ${{ matrix.deploy }}
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: docs/build/html
          # Keep en/.buildinfo and ja/.buildinfo, as the previous deployments did.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Pushes to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: html
          path: docs/build/html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
