name: doc

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# uv uses the Python from actions/setup-python (setup-uv sets UV_PYTHON to the
# same version) and never downloads one. Only `uv sync` resolves and installs;
# `uv run` uses that environment as it is.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_NO_SYNC: "1"

jobs:
  doc:
    # The Deploy step pushes to the gh-pages branch.
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      max-parallel: 5
      matrix:
        platform: [ubuntu-latest]
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install dependencies
        run: |
          uv sync
      - run: uv run make doc
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
