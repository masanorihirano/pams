[tool.poetry]
name = "pams"
version = "0.2.2"
description = "PAMS: Platform for Artificial Market Simulations"
authors = ["Masanori HIRANO <masa.hirano.1996@gmail.com>", "Ryosuke TAKATA <ryos427@yahoo.co.jp>", "Kiyoshi IZUMI"]
license = "epl-1.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
tqdm = "^4.64.1"
# numpy 1.x does not support Python 3.13+ (on Windows it crashes on import), so
# Python 3.13+ uses numpy 2. On 3.13 and 3.14 the minimum numpy and scipy are the
# first releases with wheels for that Python (3.13: numpy 2.1.0, scipy 1.14.1;
# 3.14: numpy 2.3.2, scipy 1.16.1).
numpy = [{version = "^1.25.1", python = ">=3.10,<3.13"},{version = "^2.1.0", python = ">=3.13,<3.14"},{version = "^2.3.2", python = ">=3.14,<4.0"}]
scipy = [{version = "^1.9.2", python = ">=3.10,<3.13"},{version = "^1.14.1", python = ">=3.13,<3.14"},{version = "^1.16.1", python = ">=3.14,<4.0"}]

[tool.poetry.group.dev.dependencies]
black = "^23.12.1"
isort = "^5.10.1"
mypy = "^1.19.1"
pytest = "^7.4.4"
pytest-cov = "^4.0.0"
# Sphinx 8.2+ and sphinx-autodoc-typehints 3.1+ need Python 3.11, so keep them on the
# last releases for Python 3.10. Keep these in sync with docs/requirements.txt.
Sphinx = "~8.1.3"
furo = "^2025.12.19"
jupyter = "^1.0.0"
matplotlib = "^3.4.2"
sphinx-intl = "^2.4.0"
sphinx-copybutton = "^0.5.2"
sphinx-autodoc-typehints = "~3.0.1"
sphinx-design = "^0.6.1"
flake8 = "^7.0.0"
pyproject-flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.black]
skip-magic-trailing-comma = true

[tool.isort]
profile = 'black'
force_single_line = true
skip = [
    ".git",
    "__pycache__",
    "docs",
    "build",
    "dist",
    "examples",
    ".venv",
    "tests/examples"
]

[tool.ruff]
# Mirrors the black / isort / flake8 settings above so that ruff (used by Codacy)
# agrees with the linters run in CI.
line-length = 88
target-version = "py310"
extend-exclude = ["docs", "examples", "tests/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "I", "D"]
ignore = [
    "E203", "E231", "E501",  # same as flake8 (W503 does not exist in ruff)
    "D1",    # docstrings are not mandatory
    "B905",  # zip(strict=) needs 3.10+; strict=True would add a runtime check
]
per-file-ignores = { "__init__.py" = ["F401"], "tests/**" = ["D"], "samples/**" = ["D"] }

[tool.ruff.lint.pydocstyle]
# Google style docstrings (``Args:`` / ``Returns:`` sections).
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
ignore = "E203,E231,E501,W503"
max-line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "docs",
    "build",
    "dist",
    "examples",
    ".venv",
    "__init__.py"
    ]
select = "B,B950,C,E,F,W"