[project]
name = "pams"
version = "0.2.2"
description = "PAMS: Platform for Artificial Market Simulations"
authors = [
    { name = "Masanori HIRANO", email = "masa.hirano.1996@gmail.com" },
    { name = "Ryosuke TAKATA", email = "ryos427@yahoo.co.jp" },
    { name = "Kiyoshi IZUMI" },
]
license = "EPL-1.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "tqdm>=4.64.1,<5.0.0",
    # numpy 1.x does not support Python 3.13+ (on Windows it crashes on import), so
    # Python 3.13+ uses numpy 2. On 3.13 and 3.14 the minimum numpy and scipy are the
    # first releases with wheels for that Python (3.13: numpy 2.1.0, scipy 1.14.1;
    # 3.14: numpy 2.3.2, scipy 1.16.1).
    "numpy>=1.25.1,<2.0.0; python_version < '3.13'",
    "numpy>=2.1.0,<3.0.0; python_version == '3.13'",
    "numpy>=2.3.2,<3.0.0; python_version >= '3.14'",
    "scipy>=1.9.2,<2.0.0; python_version < '3.13'",
    "scipy>=1.14.1,<2.0.0; python_version == '3.13'",
    "scipy>=1.16.1,<2.0.0; python_version >= '3.14'",
]

[dependency-groups]
dev = [
    "black>=23.12.1,<24.0.0",
    "isort>=5.10.1,<6.0.0",
    "mypy>=1.19.1,<2.0.0",
    "pytest>=7.4.4,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    # Sphinx 8.2+ and sphinx-autodoc-typehints 3.1+ need Python 3.11, so keep them on the
    # last releases for Python 3.10. The upper bounds keep every supported Python on the
    # same versions as docs/requirements.txt (used by Read the Docs); keep them in sync.
    "Sphinx>=8.1.3,<8.2.0",
    "furo>=2025.12.19,<2026.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "matplotlib>=3.4.2,<4.0.0",
    "sphinx-intl>=2.4.0,<3.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-autodoc-typehints>=3.0.1,<3.1.0",
    "sphinx-design>=0.6.1,<0.7.0",
    "flake8>=7.0.0,<8.0.0",
    "pyproject-flake8>=7.0.0,<8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package is ./pams, not ./src/pams.
module-root = ""

[tool.black]
skip-magic-trailing-comma = true

[tool.isort]
profile = 'black'
force_single_line = true
skip = [
    ".git",
    "__pycache__",
    "docs",
    "build",
    "dist",
    "examples",
    ".venv",
    "tests/examples"
]

[tool.ruff]
# Mirrors the black / isort / flake8 settings above so that ruff (used by Codacy)
# agrees with the linters run in CI.
line-length = 88
target-version = "py310"
extend-exclude = ["docs", "examples", "tests/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "I", "D"]
ignore = [
    "E203", "E231", "E501",  # same as flake8 (W503 does not exist in ruff)
    "D1",    # docstrings are not mandatory
    "B905",  # zip(strict=) needs 3.10+; strict=True would add a runtime check
]
per-file-ignores = { "__init__.py" = ["F401"], "tests/**" = ["D"], "samples/**" = ["D"] }

[tool.ruff.lint.pydocstyle]
# Google style docstrings (``Args:`` / ``Returns:`` sections).
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true

# JAX and Flax (optional, for JaxAgentParallelRunner) crash mypy 0.982 if they are
# installed, so they are not analyzed, as if they were not installed.
[[tool.mypy.overrides]]
module = ["jax", "jax.*", "jaxlib", "jaxlib.*", "flax", "flax.*"]
follow_imports = "skip"

[tool.flake8]
ignore = "E203,E231,E501,W503"
max-line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "docs",
    "build",
    "dist",
    "examples",
    ".venv",
    "__init__.py"
    ]
select = "B,B950,C,E,F,W"
